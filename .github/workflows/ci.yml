name: Build and test
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: employees
          POSTGRES_USER: employees
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U employees -d employees"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - name: PostgreSQL API smoke test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/employees
          DATABASE_USERNAME: employees
          DATABASE_PASSWORD: ci-only-password
        run: |
          java -jar backend/target/employees-1.0.0.jar > /tmp/backend.log 2>&1 &
          trap 'kill $! || true' EXIT
          python3 scripts/smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger configured deployments
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ] || [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo 'Deployment hooks must be configured in the production environment.'
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null
      - name: Verify public endpoints
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          test -n "$BACKEND_URL" && test -n "$FRONTEND_URL"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BACKEND_URL/actuator/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "UP"' && curl --fail --silent "$FRONTEND_URL" | grep -q '<div id="root">'; then exit 0; fi
            sleep 10
          done
          exit 1
