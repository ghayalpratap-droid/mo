spring.config.import=classpath:application-offline-demo.properties
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.openai.api-key=${SIS_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${SIS_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.max-tokens=700
spring.ai.openai.embedding.options.model=${SIS_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.openai.embedding.options.dimensions=1536
spring.ai.retry.max-attempts=2
sis.ai.mode=openai
sis.ai.embedding-model=${SIS_EMBEDDING_MODEL:text-embedding-3-small}
