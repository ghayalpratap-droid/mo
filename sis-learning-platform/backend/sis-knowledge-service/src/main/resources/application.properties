server.port=8092
server.address=127.0.0.1
spring.profiles.default=offline-demo
sis.jwt-secret=${SIS_JWT_SECRET}
sis.demo-password=${SIS_DEMO_PASSWORD}
management.endpoints.web.exposure.include=health,metrics
server.error.include-message=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

spring.jackson.deserialization.accept-float-as-int=false
