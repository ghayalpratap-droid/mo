spring.datasource.url=${SIS_BUSINESS_URL:jdbc:postgresql://localhost:5544/sis?currentSchema=business}
spring.datasource.username=sis_business
spring.datasource.password=${SIS_DB_PASSWORD}
spring.flyway.user=sis_migrator
spring.flyway.password=${SIS_DB_PASSWORD}
spring.flyway.schemas=business
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
