plugins {
 id 'org.springframework.boot' version '3.5.16' apply false
 id 'io.spring.dependency-management' version '1.1.7' apply false
}
subprojects {
 apply plugin: 'java'
 apply plugin: 'io.spring.dependency-management'
 group = 'edu.sis'; version = '0.1.0'
 java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
 repositories { mavenCentral() }
 dependencyManagement { imports { mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'; mavenBom 'org.springframework.ai:spring-ai-bom:1.1.8' } }
 dependencies { testImplementation 'org.springframework.boot:spring-boot-starter-test'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
 tasks.withType(Test).configureEach { useJUnitPlatform(); maxParallelForks = 1 }
 tasks.withType(JavaCompile).configureEach { options.compilerArgs += '-parameters' }
 dependencyLocking { lockAllConfigurations() }
}
