services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - employees-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees -d employees"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/employees
      DATABASE_USERNAME: employees
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
volumes:
  employees-data:
